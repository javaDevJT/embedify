extensions:
  bearertokenauth/openwoof:
    scheme: Bearer
    filename: ${env:OPENWOOF_INGEST_KEY_FILE}
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 80
    spike_limit_mib: 16

  filter/health:
    error_mode: ignore
    traces:
      span:
        - attributes["http.route"] == "/healthz"
    metrics:
      datapoint:
        - metric.name == "http.server.request.duration" and attributes["http.route"] == "/healthz"
        - metric.name == "http.server.active_requests" and attributes["http.route"] == "/healthz"

  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.original")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - replace_pattern(name, "^(HTTP )?([A-Z]+) .+$", "$1$2") where kind == SPAN_KIND_CLIENT and IsString(name)
      - context: spanevent
        statements:
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.original")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - replace_pattern(attributes["exception.message"], "(?i)(https?://)([^/@[:space:]]+@)?([^/?#[:space:]]+)(/[^?#[:space:]]*)?(\\?[^#[:space:]]*)?(#[^[:space:]]*)?", "$1$3/[redacted]") where IsString(attributes["exception.message"])
          - replace_pattern(attributes["exception.stacktrace"], "(?i)(https?://)([^/@[:space:]]+@)?([^/?#[:space:]]+)(/[^?#[:space:]]*)?(\\?[^#[:space:]]*)?(#[^[:space:]]*)?", "$1$3/[redacted]") where IsString(attributes["exception.stacktrace"])
    metric_statements:
      - context: datapoint
        statements:
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.original")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "server.address")
          - delete_key(attributes, "server.port")
          - delete_key(attributes, "network.peer.address")
          - delete_key(attributes, "network.peer.port")
          - delete_key(attributes, "net.peer.name")
          - delete_key(attributes, "net.peer.ip")
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.original")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - replace_pattern(body, "(?i)(https?://)([^/@[:space:]]+@)?([^/?#[:space:]]+)(/[^?#[:space:]]*)?(\\?[^#[:space:]]*)?(#[^[:space:]]*)?", "$1$3/[redacted]") where IsString(body)
          - replace_pattern(attributes["exception.message"], "(?i)(https?://)([^/@[:space:]]+@)?([^/?#[:space:]]+)(/[^?#[:space:]]*)?(\\?[^#[:space:]]*)?(#[^[:space:]]*)?", "$1$3/[redacted]") where IsString(attributes["exception.message"])
          - replace_pattern(attributes["exception.stacktrace"], "(?i)(https?://)([^/@[:space:]]+@)?([^/?#[:space:]]+)(/[^?#[:space:]]*)?(\\?[^#[:space:]]*)?(#[^[:space:]]*)?", "$1$3/[redacted]") where IsString(attributes["exception.stacktrace"])

  batch:
    timeout: 3s
    send_batch_size: 256

exporters:
  otlphttp/openwoof:
    endpoint: https://openwoof.javadevjt.tech
    auth:
      authenticator: bearertokenauth/openwoof
    tls:
      insecure: false
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 256
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 10m

service:
  extensions: [bearertokenauth/openwoof, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/health, transform/privacy, batch]
      exporters: [otlphttp/openwoof]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/health, transform/privacy, batch]
      exporters: [otlphttp/openwoof]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlphttp/openwoof]
