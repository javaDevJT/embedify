name: TrueNAS runner smoke
on:
  push:
    branches: [codex/truenas-runner-smoke-20260927]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, truenas, rootless-buildkit, private-build]
    timeout-minutes: 10
    steps:
      - name: Check runner permissions
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          test ! -S /var/run/docker.sock
          test ! -e /mnt/.ix-apps
          test "$(awk '/^CapEff:/ {print $2}' /proc/self/status)" = 0000000000000000
          test "$(awk '/^NoNewPrivs:/ {print $2}' /proc/self/status)" = 1
          if sudo -n true 2>/dev/null; then exit 1; fi
          test "$(stat -c %a /home/runner/.credentials)" = 600
          mkdir -p "$RUNNER_TEMP/truenas-build-smoke"
          cat > "$RUNNER_TEMP/truenas-build-smoke/Dockerfile" <<'DOCKERFILE'
          FROM alpine:3.22
          RUN test "$(id -u)" = 0 && adduser -D -u 2345 smoke && mkdir /proof && echo rootless-build-passed > /proof/result && chown 2345:2345 /proof/result
          USER 2345
          RUN test "$(id -u)" = 2345 && test "$(cat /proof/result)" = rootless-build-passed
          DOCKERFILE
          echo 'PASS: UID 1001, zero effective capabilities, no privilege escalation, no host socket'
      - name: Use isolated rootless builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_HOST }}
          driver-opts: |
            cacert=/home/runner/.buildkit/ca.pem
            cert=/home/runner/.buildkit/client.pem
            key=/home/runner/.buildkit/client.key
      - name: Build OCI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ runner.temp }}/truenas-build-smoke
          platforms: linux/amd64
          push: false
          no-cache: true
          outputs: type=oci,dest=${{ runner.temp }}/truenas-smoke.tar
      - name: Confirm build and clean scratch files
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/truenas-smoke.tar"
          rm -f "$RUNNER_TEMP/truenas-smoke.tar"
          rm -rf "$RUNNER_TEMP/truenas-build-smoke"
          echo 'PASS: real GitHub Actions job and rootless Docker build' >> "$GITHUB_STEP_SUMMARY"
