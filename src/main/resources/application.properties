spring.application.name=embedify
spring.servlet.multipart.enabled=false
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-path=never
server.tomcat.max-http-form-post-size=512KB
server.max-http-request-header-size=32KB
server.tomcat.max-swallow-size=512KB
embedify.upstream.max-concurrent=12
# Keep empty until the deployed reverse-proxy peer ranges are known and verified.
embedify.trusted-proxies=
server.tomcat.connection-timeout=10s
